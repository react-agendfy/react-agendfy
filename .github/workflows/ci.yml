name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x] # 18 removed: some packages no longer support it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # Typecheck is currently non-blocking: packages/core/src still has
      # pre-existing type errors to clean up. Drop continue-on-error once green.
      - name: Typecheck
        continue-on-error: true
        run: |
          npx tsc --noEmit -p packages/core/tsconfig.json
          npx tsc --noEmit -p packages/plugins/filters/tsconfig.json
          npx tsc --noEmit -p packages/plugins/timeline/tsconfig.json
          npx tsc --noEmit -p packages/plugins/theme/tsconfig.json

      - name: Test core
        run: yarn workspace @react-agendfy/core test

      - name: Build all workspaces
        run: yarn workspaces foreach --all --topological --no-private -v run build
