name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x] # 18 removed: some packages no longer support it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm's version comes from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Plugin packages use project references to @react-agendfy/core, so they
      # are checked with `tsc -b` (build mode), which emits core's declaration
      # files first and then typechecks each plugin against them.
      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit -p packages/core/tsconfig.json
          pnpm exec tsc -b packages/plugins/filters packages/plugins/timeline packages/plugins/theme

      - name: Test
        run: pnpm test:packages

      - name: Build all packages
        run: pnpm build:packages
